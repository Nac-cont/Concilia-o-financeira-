<body><div id="root"></div>
<script type="text/babel">
const {useState,useRef,useEffect,useMemo}=React;
const C={navy:"#0F1F3D",teal:"#0D9488",gold:"#F59E0B",danger:"#EF4444",success:"#10B981",purple:"#8B5CF6",gray:"#6B7280",border:"#E2E8F0",bg:"#EEF2F7"};
const fmt=n=>(n==null||isNaN(n))?"R$ -":new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(+n);
const pct=(n,b)=>b?((n/b)*100).toFixed(1)+"%":"-%";
const KEY="nacaratto_v9";
const PERIODOS={
  "Q1-2025":{label:"1 Trim 2025",meses:["Janeiro","Fevereiro","Marco"],ano:2025},
  "Q2-2025":{label:"2 Trim 2025",meses:["Abril","Maio","Junho"],ano:2025},
  "Q3-2025":{label:"3 Trim 2025",meses:["Julho","Agosto","Setembro"],ano:2025},
  "Q4-2025":{label:"4 Trim 2025",meses:["Outubro","Novembro","Dezembro"],ano:2025},
  "Q1-2026":{label:"1 Trim 2026",meses:["Janeiro","Fevereiro","Marco"],ano:2026},
  "Q2-2026":{label:"2 Trim 2026",meses:["Abril","Maio","Junho"],ano:2026},
  "Q3-2026":{label:"3 Trim 2026",meses:["Julho","Agosto","Setembro"],ano:2026},
  "Q4-2026":{label:"4 Trim 2026",meses:["Outubro","Novembro","Dezembro"],ano:2026},
};
const CLIENTES=[
  {id:1,num:1,nome:"Fabio Trindade"},{id:2,num:2,nome:"Carol PSI"},{id:3,num:3,nome:"Gustavo Nacaratto"},
  {id:4,num:4,nome:"Patricia"},{id:5,num:5,nome:"Misael Pereira"},{id:6,num:6,nome:"Norimitsu Onishi"},
  {id:7,num:7,nome:"Guilherme"},{id:8,num:8,nome:"Maria do Socorro"},{id:9,num:9,nome:"Gisele"},
  {id:10,num:10,nome:"Kelly"},{id:11,num:11,nome:"Isadora"},{id:12,num:12,nome:"Angela"},
  {id:13,num:13,nome:"DEBLY"},{id:14,num:14,nome:"Mariana e Adriana"},{id:15,num:15,nome:"Fernanda"},
  {id:16,num:16,nome:"Daniela"},{id:17,num:17,nome:"Mayra"},{id:18,num:18,nome:"Francisco"},
  {id:19,num:19,nome:"Giovanna"},{id:20,num:20,nome:"Douglas"},{id:21,num:21,nome:"Adilson Silva"},
  {id:22,num:22,nome:"Luiz Miguel"},{id:23,num:23,nome:"Vera Lucia"},{id:24,num:24,nome:"DRAUSIO"},
  {id:25,num:25,nome:"Nilo Marcos"},
];
function salvar(d){try{localStorage.setItem(KEY,JSON.stringify(d));}catch(e){}}
function carregar(){try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);if(p.clientes)return p;}const d={clientes:CLIENTES.map(c=>({...c})),periodos:{}};salvar(d);return d;}catch(e){return{clientes:CLIENTES.map(c=>({...c})),periodos:{}};}}
function Btn({onClick,disabled,style,children,title}){return <button title={title} onClick={onClick} disabled={disabled} style={{cursor:disabled?"not-allowed":"pointer",border:"none",background:"none",fontFamily:"Sora,sans-serif",...style}}>{children}</button>;}
function Card({children,style}){return <div style={{background:"#fff",borderRadius:14,border:"1px solid #E2E8F0",boxShadow:"0 1px 4px rgba(0,0,0,.06)",...style}}>{children}</div>;}
function KpiCard({icon,label,value,sub,color,border}){return(<Card style={{padding:"16px 18px",borderLeft:border?`4px solid ${border}`:"none"}}><p style={{fontSize:11,color:C.gray,textTransform:"uppercase",letterSpacing:1,marginBottom:6}}>{label}</p><p style={{fontSize:22,fontWeight:800,color:color||C.navy,fontFamily:"JetBrains Mono,monospace",marginBottom:4}}>{value}</p>{sub&&<p style={{fontSize:11,color:C.gray}}>{sub}</p>}</Card>);}

function BarChart({data,keys,colors,height=180}){
  const max=Math.max(...data.flatMap(d=>keys.map(k=>d[k]||0)),1);
  return(<div style={{display:"flex",alignItems:"flex-end",gap:8,height,paddingTop:20,position:"relative"}}>
    {data.map((d,i)=>(
      <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2}}>
        <div style={{width:"100%",display:"flex",gap:2,alignItems:"flex-end",height:height-30}}>
          {keys.map((k,ki)=>{
            const h=Math.max(2,((d[k]||0)/max)*(height-30));
            return <div key={ki} style={{flex:1,height:h,background:colors[ki],borderRadius:"3px 3px 0 0",transition:"height .3s"}} title={fmt(d[k])}/>;
          })}
        </div>
        <p style={{fontSize:9,color:C.gray,textAlign:"center"}}>{d.label}</p>
      </div>
    ))}
  </div>);
}

function PieChart({data,colors,size=140}){
  const total=data.reduce((s,d)=>s+(d.value||0),0);
  if(total===0)return <p style={{color:C.gray,fontSize:12}}>Sem dados</p>;
  let angle=0;
  const slices=data.map((d,i)=>{
    const pct=(d.value/total)*360;
    const start=angle;
    angle+=pct;
    return{...d,start,pct,color:colors[i%colors.length]};
  });
  const r=size/2,cx=r,cy=r;
  const arc=(s,p)=>{
    const startRad=(s-90)*Math.PI/180;
    const endRad=(s+p-90)*Math.PI/180;
    const x1=cx+r*Math.cos(startRad),y1=cy+r*Math.sin(startRad);
    const x2=cx+r*Math.cos(endRad),y2=cy+r*Math.sin(endRad);
    const large=p>180?1:0;
    return `M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z`;
  };
  return(
    <div style={{display:"flex",gap:16,alignItems:"center",flexWrap:"wrap"}}>
      <svg width={size} height={size} style={{flexShrink:0}}>
        {slices.map((s,i)=><path key={i} d={arc(s.start,s.pct)} fill={s.color} stroke="#fff" strokeWidth={1}><title>{s.name}: {fmt(s.value)} ({((s.value/total)*100).toFixed(1)}%)</title></path>)}
      </svg>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {slices.map((s,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:10,height:10,borderRadius:2,background:s.color,flexShrink:0}}/>
            <span style={{fontSize:11,color:C.gray}}>{s.name}</span>
            <span style={{fontSize:11,fontWeight:600,fontFamily:"JetBrains Mono,monospace",marginLeft:"auto",paddingLeft:8}}>{((s.value/total)*100).toFixed(0)}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

async function callAI(sys,usr){
  try{
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:4000,system:sys,messages:[{role:"user",content:usr}]})});
    const d=await res.json();if(d.error)return null;
    const raw=(d.content||[]).map(b=>b.text||"").join("");
    const clean=raw.replace(/```json/gi,"").replace(/```/g,"").trim();
    try{return JSON.parse(clean);}catch(_){}
    const m=clean.match(/\{[\s\S]*\}/);if(m){try{return JSON.parse(m[0]);}catch(_){}}
    return null;
  }catch(e){return null;}
}

function gerarFallback(meses){
  const rnd=(a,b)=>Math.round((a+Math.random()*(b-a))*100)/100;
  const rc=["Prestacao de Servicos","Vendas de Produtos","Comissoes","Outras Receitas"];
  const dc=["Folha de Pagamento","Aluguel","Fornecedores","Impostos","Despesas Bancarias","Outras Despesas"];
  const t=[],rm={},dm={},rcat={},dcat={};
  meses.forEach(m=>{rm[m]=0;dm[m]=0;});
  meses.forEach((mes,mi)=>{
    rc.forEach((c,ci)=>{const v=rnd(5000,22000);t.push({data:`2025-0${mi+1}-${String(3+ci*5).padStart(2,"0")}`,descricao:c,valor:v,tipo:"receita",categoria:c,mes});rm[mes]+=v;rcat[c]=(rcat[c]||0)+v;});
    dc.forEach((c,ci)=>{const v=rnd(1500,9000);t.push({data:`2025-0${mi+1}-${String(4+ci*4).padStart(2,"0")}`,descricao:c,valor:v,tipo:"despesa",categoria:c,mes});dm[mes]+=v;dcat[c]=(dcat[c]||0)+v;});
  });
  const tr=Object.values(rm).reduce((a,b)=>a+b,0),td=Object.values(dm).reduce((a,b)=>a+b,0),ll=tr-td;
  return{transacoes:t,resumo:{totalReceitas:tr,totalDespesas:td,lucroLiquido:ll,receitasPorMes:rm,despesasPorMes:dm,receitasPorCategoria:rcat,despesasPorCategoria:dcat},
    analise:{situacao:ll>0?"lucro":"prejuizo",distribuicaoPossivel:ll>0,valorSugerido:ll>0?Math.round(ll*0.5):0,
    pontosForca:["Receitas diversificadas","Margem operacional positiva"],
    pontosAtencao:["Monitorar custos operacionais","Verificar inadimplencia"],
    recomendacoes:["Revisar contratos de fornecedores","Constituir reserva de 3 meses"]}};
}

function Header({step,setStep}){
  const steps=["Clientes","Periodo","Processar","Dashboard","Relatorio"];
  return(<div className="noprint" style={{background:C.navy,padding:"0 20px",position:"sticky",top:0,zIndex:200,boxShadow:"0 2px 16px rgba(0,0,0,.3)"}}>
    <div style={{maxWidth:1100,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:56}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:34,height:34,borderRadius:9,background:C.teal,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,fontWeight:700,color:"#fff"}}>NC</div>
        <div><p style={{color:"#fff",fontWeight:700,fontSize:13}}>Conciliacao Financeira</p><p style={{color:C.teal,fontSize:9,letterSpacing:.5}}>NACARATTO CONTABILIDADE</p></div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        {steps.map((s,i)=>(<div key={s} style={{display:"flex",alignItems:"center",gap:4}}>

            style={{width:26,height:26,borderRadius:13,background:i===step?C.teal:i<step?C.gold:"rgba(255,255,255,.15)",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,color:"#fff",cursor:i<step?"pointer":"default"}}>
            {i<step?"v":i+1}
          </div>
          {i<steps.length-1&&<div style={{width:14,height:2,background:i<step?C.gold:"rgba(255,255,255,.15)",borderRadius:1}}/>}
        </div>))}
      </div>
    </div>
  </div>);}

function Step1({dados,setDados,onNext}){
  const [novo,setNovo]=useState("");const [editId,setEditId]=useState(null);const [editNome,setEditNome]=useState("");
  const clientes=dados.clientes;
  const upd=lista=>{const d={...dados,clientes:lista};setDados(d);salvar(d);};
  const add=()=>{if(!novo.trim())return;const max=Math.max(...clientes.map(c=>c.num||0),0);upd([...clientes,{id:Date.now(),num:max+1,nome:novo.trim()}]);setNovo("");};
  const ok=id=>{upd(clientes.map(c=>c.id===id?{...c,nome:editNome}:c));setEditId(null);};
  const del=id=>{if(!window.confirm("Remover?"))return;upd(clientes.filter(c=>c.id!==id));};
  return(<div style={{maxWidth:660,margin:"0 auto",animation:"fadein .3s"}}>
    <Card style={{padding:"14px 18px",marginBottom:18,borderLeft:"4px solid "+C.teal}}>
      <p style={{fontSize:13,color:C.navy,fontWeight:600}}>25 clientes Nacaratto carregados. Clique em Editar para corrigir o nome conforme o CNPJ.</p>
    </Card>
    <h2 style={{fontSize:20,fontWeight:700,color:C.navy,marginBottom:14}}>1. Gestao de Clientes</h2>
    <div style={{display:"flex",gap:10,marginBottom:14}}>
      <input value={novo} onChange={e=>setNovo(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} placeholder="Nome do novo cliente..."
        style={{flex:1,padding:"10px 14px",border:"1.5px solid "+C.border,borderRadius:9,fontSize:14,outline:"none"}}/>
      <Btn onClick={add} style={{background:C.teal,color:"#fff",borderRadius:9,padding:"10px 20px",fontSize:14,fontWeight:600}}>+ Adicionar</Btn>
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:5,marginBottom:22}}>
      {clientes.map(cl=>(<Card key={cl.id} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px"}}>
        <div style={{width:26,height:26,borderRadius:"50%",background:C.navy,color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:700,flexShrink:0}}>{cl.num}</div>
        {editId===cl.id
          ?<><input value={editNome} onChange={e=>setEditNome(e.target.value)} autoFocus onKeyDown={e=>e.key==="Enter"&&ok(cl.id)}
              style={{flex:1,padding:"5px 10px",border:"1.5px solid "+C.teal,borderRadius:7,fontSize:13,outline:"none"}}/>
            <Btn onClick={()=>ok(cl.id)} style={{background:C.teal,color:"#fff",borderRadius:7,padding:"5px 12px",fontSize:12,fontWeight:600}}>OK</Btn>
            <Btn onClick={()=>setEditId(null)} style={{background:"#f1f5f9",color:C.gray,borderRadius:7,padding:"5px 10px",fontSize:12}}>X</Btn></>
          :<><span style={{flex:1,fontWeight:500,fontSize:13}}>{cl.nome}</span>
            <Btn onClick={()=>{setEditId(cl.id);setEditNome(cl.nome);}} style={{color:C.teal,fontSize:11,padding:"3px 8px",border:"1px solid "+C.teal,borderRadius:6}} title="Editar nome CNPJ">Editar</Btn>
            <Btn onClick={()=>del(cl.id)} style={{color:C.danger,fontSize:16,padding:"0 4px"}}>x</Btn></>
        }
      </Card>))}
    </div>
    <Btn onClick={onNext} style={{width:"100%",background:C.navy,color:"#fff",borderRadius:10,padding:"13px 0",fontSize:15,fontWeight:700}}>Proximo: Periodo e Upload</Btn>
  </div>);}

function Step2({dados,setDados,periodo,setPeriodo,onNext,onBack}){
  const refs=useRef({});const trim=PERIODOS[periodo];const clientes=dados.clientes;const pd=dados.periodos?.[periodo]||{};
  const getA=id=>(pd[id]?.arquivos)||[];
  const setA=(id,arqs)=>{const d={...dados,periodos:{...dados.periodos,[periodo]:{...pd,[id]:{...pd[id],arquivos:arqs}}}};setDados(d);salvar(d);};
  return(<div style={{maxWidth:760,margin:"0 auto",animation:"fadein .3s"}}>
    <h2 style={{fontSize:20,fontWeight:700,color:C.navy,marginBottom:14}}>2. Periodo e Documentos</h2>
    <Card style={{padding:"16px 20px",marginBottom:14}}>
      <p style={{fontSize:11,color:C.gray,textTransform:"uppercase",letterSpacing:1,fontWeight:600,marginBottom:10}}>Selecionar Periodo</p>
      <div style={{display:"flex",gap:12,flexWrap:"wrap",alignItems:"center"}}>
        <select value={periodo} onChange={e=>setPeriodo(e.target.value)}
          style={{padding:"9px 14px",border:"1.5px solid "+C.border,borderRadius:9,fontSize:14,background:"#fff",fontWeight:600,color:C.navy,minWidth:190,cursor:"pointer"}}>
          {Object.entries(PERIODOS).map(([k,v])=>{const td=dados.periodos?.[k]&&Object.keys(dados.periodos[k]).some(x=>dados.periodos[k][x]?.resumo);return <option key={k} value={k}>{v.label}{td?" OK":""}</option>;})}
        </select>
        <div style={{display:"flex",gap:6}}>{trim.meses.map(m=><span key={m} style={{background:"#F0FDF9",color:C.teal,padding:"5px 12px",borderRadius:99,fontSize:12,fontWeight:600,border:"1px solid #99F6E4"}}>{m}</span>)}</div>
      </div>
    </Card>
    <div style={{display:"flex",flexDirection:"column",gap:7}}>
      {clientes.map(cl=>{const arqs=getA(cl.id);return(
        <Card key={cl.id} style={{overflow:"hidden"}}>
          <div style={{background:C.navy,padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{color:"#fff",fontWeight:600,fontSize:13}}>{cl.num}. {cl.nome}</span>
            <span style={{fontSize:11,fontWeight:600,color:pd[cl.id]?.resumo?C.success:arqs.length?C.gold:"rgba(255,255,255,.5)"}}>
              {pd[cl.id]?.resumo?"Analisado":arqs.length?arqs.length+" arq.":"Sem arquivos"}
            </span>
          </div>
          <div style={{padding:9}}>
            <div onClick={()=>refs.current[cl.id]?.click()} onMouseOver={e=>e.currentTarget.style.borderColor=C.teal} onMouseOut={e=>e.currentTarget.style.borderColor=C.border}
              style={{border:"2px dashed "+C.border,borderRadius:8,padding:"8px",textAlign:"center",cursor:"pointer",transition:"border-color .2s"}}>
              <p style={{fontSize:12,color:C.gray}}>Clique para selecionar arquivos - PDF, XLSX, CSV, PNG</p>
              <input ref={el=>refs.current[cl.id]=el} type="file" multiple accept=".pdf,.xlsx,.csv,.png,.jpg,.jpeg"
                style={{display:"none"}} onChange={e=>setA(cl.id,[...arqs,...Array.from(e.target.files).map(f=>({nome:f.name,tipo:f.type}))])}/>
            </div>
            {arqs.length>0&&<div style={{marginTop:5,display:"flex",flexDirection:"column",gap:3}}>
              {arqs.map((a,i)=>(<div key={i} style={{display:"flex",alignItems:"center",gap:8,background:"#F0FDF9",borderRadius:6,padding:"4px 10px"}}>
                <span style={{flex:1,fontSize:11,color:C.navy}}>{a.nome}</span>
                <Btn onClick={()=>setA(cl.id,arqs.filter((_,j)=>j!==i))} style={{color:C.danger,fontSize:13,padding:0}}>x</Btn>
              </div>))}
            </div>}
          </div>
        </Card>
      );})}
    </div>
    <div style={{display:"flex",gap:12,marginTop:18}}>
      <Btn onClick={onBack} style={{flex:1,background:"#fff",color:C.navy,border:"1.5px solid "+C.border,borderRadius:10,padding:"12px 0",fontWeight:600,fontSize:14}}>Voltar</Btn>
      <Btn onClick={onNext} style={{flex:2,background:C.teal,color:"#fff",borderRadius:10,padding:"12px 0",fontWeight:700,fontSize:15}}>Analisar com IA</Btn>
    </div>
  </div>);}

function Step3({dados,setDados,periodo,onNext,onBack}){
  const [est,setEst]=useState("idle");const [atual,setAtual]=useState("");const [prog,setProg]=useState(0);const [log,setLog]=useState([]);
  const trim=PERIODOS[periodo];const clientes=dados.clientes;const pd=dados.periodos?.[periodo]||{};
  const processar=async()=>{
    setEst("proc");setLog([]);const novoPd={...pd};
    for(let i=0;i<clientes.length;i++){
      const cl=clientes[i];setAtual(cl.nome);setProg(Math.round((i/clientes.length)*100));setLog(p=>[...p,"Processando "+cl.nome+"..."]);
      const arqs=(pd[cl.id]?.arquivos||[]).map(a=>a.nome).join(", ")||"nenhum";
      const sys="Voce e um contador especialista brasileiro. Responda APENAS com JSON puro valido, sem markdown.";
      const usr='Cliente: "'+cl.nome+'". Periodo: '+trim.label+'. Meses: '+trim.meses.join(", ")+'. Arquivos: '+arqs+'. Gere analise financeira simulada realista. Retorne este JSON: {"transacoes":[{"data":"2025-01-10","descricao":"Receita","valor":12000,"tipo":"receita","categoria":"Prestacao de Servicos","mes":"'+trim.meses[0]+'"}],"resumo":{"totalReceitas":85000,"totalDespesas":55000,"lucroLiquido":30000,"receitasPorMes":{"'+trim.meses[0]+'":27000,"'+trim.meses[1]+'":28000,"'+trim.meses[2]+'":30000},"despesasPorMes":{"'+trim.meses[0]+'":18000,"'+trim.meses[1]+'":18000,"'+trim.meses[2]+'":19000},"receitasPorCategoria":{"Prestacao de Servicos":50000,"Vendas":35000},"despesasPorCategoria":{"Folha":28000,"Aluguel":10000,"Fornecedores":17000}},"analise":{"situacao":"lucro","distribuicaoPossivel":true,"valorSugerido":15000,"pontosForca":["Margem positiva"],"pontosAtencao":["Folha elevada"],"recomendacoes":["Revisar fornecedores"]}} REGRAS: min 12 transacoes. totalReceitas=soma(receitasPorMes). lucroLiquido=totalReceitas-totalDespesas.';
      let r=await callAI(sys,usr);
      const ok=r&&r.resumo&&Array.isArray(r.transacoes)&&r.transacoes.length>=6;
      if(!ok){setLog(p=>[...p,"Dados locais: "+cl.nome]);r=gerarFallback(trim.meses);}
      else setLog(p=>[...p,"OK: "+cl.nome+" - "+r.transacoes.length+" lancamentos"]);
      novoPd[cl.id]={...(pd[cl.id]||{}),transacoes:r.transacoes,resumo:r.resumo,analise:r.analise};
    }
    setProg(100);const d={...dados,periodos:{...dados.periodos,[periodo]:novoPd}};setDados(d);salvar(d);setEst("done");
  };
  if(est==="idle")return(<div style={{maxWidth:500,margin:"0 auto",textAlign:"center",animation:"fadein .3s"}}>
    <div style={{fontSize:54,marginBottom:10}}>IA</div>
    <h2 style={{fontSize:20,fontWeight:700,color:C.navy,marginBottom:8}}>3. Analise com IA</h2>

    <Card style={{overflow:"hidden",marginBottom:14}}>
      <div className="noprint" style={{display:"flex",gap:4,padding:"10px 14px",borderBottom:"1px solid "+C.border,background:"#F8FAFC",flexWrap:"wrap"}}>
        <Tab id="dre" label="DRE"/><Tab id="av" label="Analise Vertical"/><Tab id="ah" label="Analise Horizontal"/><Tab id="fluxo" label="Fluxo de Caixa"/><Tab id="lanc" label="Lancamentos"/><Tab id="ia" label="Analise IA"/>
      </div>
      <div style={{padding:18}}>
        {aba==="dre"&&(<table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:C.navy}}>{["Descricao",...meses,"Total"].map(h=>(<th key={h} style={{padding:"9px 12px",color:"#fff",textAlign:h==="Descricao"?"left":"right",fontSize:11}}>{h}</th>))}</tr></thead><tbody>
          <tr><td colSpan={meses.length+2} style={{padding:"10px 12px 4px",fontWeight:700,color:C.success,fontSize:11,textTransform:"uppercase"}}>RECEITAS</td></tr>
          {Object.entries(r.receitasPorCategoria||{}).map(([cat,val])=>(<tr key={cat} style={{borderBottom:"1px solid "+C.border}}><td style={{padding:"8px 12px",color:C.navy}}>{cat}</td>{meses.map(m=><td key={m} style={{padding:"8px 12px",textAlign:"right",fontSize:11,color:C.gray}}>-</td>)}<td style={{padding:"8px 12px",textAlign:"right",fontWeight:600,color:C.success,fontFamily:"JetBrains Mono,monospace"}}>{fmt(val)}</td></tr>))}
          <tr style={{background:"#F0FDF4"}}><td style={{padding:"10px 12px",fontWeight:700}}>Total Receitas</td>{meses.map(m=><td key={m} style={{padding:"10px 12px",textAlign:"right",fontWeight:700,color:C.success,fontFamily:"JetBrains Mono,monospace",fontSize:12}}>{fmt(r.receitasPorMes?.[m])}</td>)}<td style={{padding:"10px 12px",textAlign:"right",fontWeight:800,color:C.success,fontFamily:"JetBrains Mono,monospace"}}>{fmt(r.totalReceitas)}</td></tr>
          <tr><td colSpan={meses.length+2} style={{padding:"10px 12px 4px",fontWeight:700,color:C.danger,fontSize:11,textTransform:"uppercase"}}>DESPESAS</td></tr>
          {Object.entries(r.despesasPorCategoria||{}).map(([cat,val])=>(<tr key={cat} style={{borderBottom:"1px solid "+C.border}}><td style={{padding:"8px 12px",color:C.navy}}>{cat}</td>{meses.map(m=><td key={m} style={{padding:"8px 12px",textAlign:"right",fontSize:11,color:C.gray}}>-</td>)}<td style={{padding:"8px 12px",textAlign:"right",fontWeight:600,color:C.danger,fontFamily:"JetBrains Mono,monospace"}}>{fmt(val)}</td></tr>))}
          <tr style={{background:"#FEF2F2"}}><td style={{padding:"10px 12px",fontWeight:700}}>Total Despesas</td>{meses.map(m=><td key={m} style={{padding:"10px 12px",textAlign:"right",fontWeight:700,color:C.danger,fontFamily:"JetBrains Mono,monospace",fontSize:12}}>{fmt(r.despesasPorMes?.[m])}</td>)}<td style={{padding:"10px 12px",textAlign:"right",fontWeight:800,color:C.danger,fontFamily:"JetBrains Mono,monospace"}}>{fmt(r.totalDespesas)}</td></tr>
          <tr style={{background:r.lucroLiquido>=0?"#ECFDF5":"#FEF2F2",borderTop:"2px solid "+(r.lucroLiquido>=0?C.success:C.danger)}}><td colSpan={meses.length+1} style={{padding:"13px 12px",fontWeight:800,fontSize:15,color:C.navy}}>RESULTADO DO PERIODO</td><td style={{padding:"13px 12px",textAlign:"right",fontWeight:800,fontSize:17,color:r.lucroLiquido>=0?C.success:C.danger,fontFamily:"JetBrains Mono,monospace"}}>{fmt(r.lucroLiquido)}</td></tr>
        </tbody></table>)}
        {aba==="av"&&(<div><p style={{fontSize:12,color:C.gray,marginBottom:14}}>Analise Vertical - cada item como % da Receita Total ({fmt(r.totalReceitas)})</p>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:C.navy}}>{["Item","Valor","% Receita","Barra"].map(h=>(<th key={h} style={{padding:"9px 12px",color:"#fff",textAlign:h==="Item"?"left":"right",fontSize:11}}>{h}</th>))}</tr></thead><tbody>
          <tr><td colSpan={4} style={{padding:"10px 12px 4px",fontWeight:700,color:C.success,fontSize:11,textTransform:"uppercase"}}>RECEITAS</td></tr>
          {Object.entries(r.receitasPorCategoria||{}).map(([cat,val])=>{const p=r.totalReceitas>0?(val/r.totalReceitas*100):0;return(<tr key={cat} style={{borderBottom:"1px solid "+C.border}}><td style={{padding:"8px 12px"}}>{cat}</td><td style={{padding:"8px 12px",textAlign:"right",fontFamily:"JetBrains Mono,monospace",color:C.success}}>{fmt(val)}</td><td style={{padding:"8px 12px",textAlign:"right",fontWeight:600,color:C.teal}}>{p.toFixed(1)}%</td><td style={{padding:"8px 12px",width:120}}><div style={{background:"#F0FDF9",borderRadius:99,height:8,overflow:"hidden"}}><div style={{height:"100%",width:Math.min(100,p)+"%",background:C.teal,borderRadius:99}}/></div></td></tr>);})}
          <tr style={{background:"#F0FDF4",borderTop:"2px solid "+C.success}}><td style={{padding:"9px 12px",fontWeight:700}}>Total Receitas</td><td style={{padding:"9px 12px",textAlign:"right",fontWeight:700,color:C.success,fontFamily:"JetBrains Mono,monospace"}}>{fmt(r.totalReceitas)}</td><td style={{padding:"9px 12px",textAlign:"right",fontWeight:700,color:C.success}}>100,0%</td><td/></tr>
          <tr><td colSpan={4} style={{padding:"10px 12px 4px",fontWeight:700,color:C.danger,fontSize:11,textTransform:"uppercase"}}>DESPESAS</td></tr>
          {Object.entries(r.despesasPorCategoria||{}).map(([cat,val])=>{const p=r.totalReceitas>0?(val/r.totalReceitas*100):0;return(<tr key={cat} style={{borderBottom:"1px solid "+C.border}}><td style={{padding:"8px 12px"}}>{cat}</td><td style={{padding:"8px 12px",textAlign:"right",fontFamily:"JetBrains Mono,monospace",color:C.danger}}>{fmt(val)}</td><td style={{padding:"8px 12px",textAlign:"right",fontWeight:600,color:C.danger}}>{p.toFixed(1)}%</td><td style={{padding:"8px 12px",width:120}}><div style={{background:"#FEF2F2",borderRadius:99,height:8,overflow:"hidden"}}><div style={{height:"100%",width:Math.min(100,p)+"%",background:C.danger,borderRadius:99}}/></div></td></tr>);})}
          <tr style={{background:r.lucroLiquido>=0?"#ECFDF5":"#FEF2F2",borderTop:"2px solid "+(r.lucroLiquido>=0?C.success:C.danger)}}><td style={{padding:"10px 12px",fontWeight:800,fontSize:14}}>Resultado</td><td style={{padding:"10px 12px",textAlign:"right",fontWeight:800,color:r.lucroLiquido>=0?C.success:C.danger,fontFamily:"JetBrains Mono,monospace",fontSize:15}}>{fmt(r.lucroLiquido)}</td><td style={{padding:"10px 12px",textAlign:"right",fontWeight:800,color:r.lucroLiquido>=0?C.success:C.danger,fontSize:15}}>{pct(r.lucroLiquido,r.totalReceitas)}</td><td/></tr>
          </tbody></table></div>)}
        {aba==="ah"&&(<div><p style={{fontSize:12,color:C.gray,marginBottom:14}}>Analise Horizontal - variacao entre os meses do trimestre</p>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}><thead><tr style={{background:C.navy}}>{["Item",...meses.map((m,i)=>i===0?m:m+" (var.%)")].map(h=>(<th key={h} style={{padding:"9px 12px",color:"#fff",textAlign:h==="Item"?"left":"right",fontSize:11}}>{h}</th>))}</tr></thead><tbody>
          {[{label:"Total Receitas",vals:meses.map(m=>r.receitasPorMes?.[m]||0),cor:C.success},{label:"Total Despesas",vals:meses.map(m=>r.despesasPorMes?.[m]||0),cor:C.danger},{label:"Lucro Liquido",vals:meses.map(m=>(r.receitasPorMes?.[m]||0)-(r.despesasPorMes?.[m]||0)),cor:C.teal}].map(row=>(
            <tr key={row.label} style={{borderBottom:"1px solid "+C.border}}><td style={{padding:"9px 12px",fontWeight:600}}>{row.label}</td>
            {row.vals.map((v,i)=>{const prev=i>0?row.vals[i-1]:null;const dif=prev!=null&&prev!==0?(((v-prev)/Math.abs(prev))*100).toFixed(1):null;return(<td key={i} style={{padding:"9px 12px",textAlign:"right"}}><div style={{fontFamily:"JetBrains Mono,monospace",fontWeight:600,color:row.cor}}>{fmt(v)}</div>{dif!=null&&<div style={{fontSize:10,color:+dif>=0?C.success:C.danger}}>{+dif>=0?"+":""}{dif}%</div>}</td>);})}
          </tr>))}
          </tbody></table></div>)}
        {aba==="fluxo"&&(<div><div style={{display:"grid",gridTemplateColumns:"repeat("+meses.length+",1fr)",gap:14,marginBottom:16}}>
          {meses.map(mes=>{const rec=r.receitasPorMes?.[mes]||0,des=r.despesasPorMes?.[mes]||0,sal=rec-des;return(<Card key={mes} style={{padding:16}}><p style={{fontWeight:700,color:C.navy,marginBottom:14,fontSize:15}}>{mes}</p>{[["Entradas",rec,C.success],["Saidas",des,C.danger]].map(([l,v,c])=>(<div key={l} style={{display:"flex",justifyContent:"space-between",marginBottom:8}}><span style={{fontSize:12,color:C.gray}}>{l}</span><span style={{fontSize:13,fontWeight:600,color:c,fontFamily:"JetBrains Mono,monospace"}}>{fmt(v)}</span></div>))}<div style={{borderTop:"1px solid "+C.border,paddingTop:10,display:"flex",justifyContent:"space-between",marginBottom:10}}><span style={{fontSize:12,fontWeight:700}}>Saldo</span><span style={{fontSize:15,fontWeight:800,color:sal>=0?C.success:C.danger,fontFamily:"JetBrains Mono,monospace"}}>{fmt(sal)}</span></div><div style={{height:7,background:C.border,borderRadius:99,overflow:"hidden",marginBottom:5}}><div style={{height:"100%",width:Math.min(100,rec>0?(Math.abs(sal)/rec)*100:0)+"%",background:sal>=0?C.success:C.danger,borderRadius:99}}/></div><p style={{fontSize:10,color:C.gray,textAlign:"right"}}>Margem: {rec>0?((sal/rec)*100).toFixed(1):0}%</p></Card>);})}
        </div></div>)}
        {aba==="lanc"&&(<div><p style={{fontSize:12,color:C.gray,marginBottom:10}}>{(cld.transacoes||[]).filter(t=>!mesF||t.mes===mesF).length} lancamentos</p>
          <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}><thead><tr style={{background:"#F1F5F9"}}>{["Data","Descricao","Mes","Tipo","Categoria","Valor"].map(h=>(<th key={h} style={{padding:"8px 12px",textAlign:h==="Valor"?"right":"left",color:C.navy,fontWeight:600,fontSize:11,textTransform:"uppercase"}}>{h}</th>))}</tr></thead>
          <tbody>{(cld.transacoes||[]).filter(t=>!mesF||t.mes===mesF).map((t,i)=>(<tr key={i} style={{borderBottom:"1px solid "+C.border,background:i%2===0?"#fff":"#F8FAFC"}}><td style={{padding:"7px 12px",color:C.gray}}>{t.data}</td><td style={{padding:"7px 12px",color:C.navy}}>{t.descricao}</td><td style={{padding:"7px 12px",color:C.gray}}>{t.mes}</td><td style={{padding:"7px 12px"}}><span style={{background:t.tipo==="receita"?"#D1FAE5":"#FEE2E2",color:t.tipo==="receita"?"#065F46":"#991B1B",padding:"2px 8px",borderRadius:99,fontSize:10,fontWeight:700}}>{t.tipo}</span></td><td style={{padding:"7px 12px",color:C.gray,fontSize:11}}>{t.categoria}</td><td style={{padding:"7px 12px",textAlign:"right",fontFamily:"JetBrains Mono,monospace",fontWeight:600,color:t.tipo==="receita"?C.success:C.danger}}>{fmt(t.valor)}</td></tr>))}</tbody>
          </table></div></div>)}
        {aba==="ia"&&an&&(<div><div style={{display:"flex",alignItems:"center",gap:14,marginBottom:18,background:"#F8FAFC",borderRadius:12,padding:"16px 20px"}}><div style={{width:48,height:48,borderRadius:"50%",background:an.situacao==="lucro"?C.success:C.danger,display:"flex",alignItems:"center",justifyContent:"center",fontSize:20,color:"#fff",fontWeight:700}}>{an.situacao==="lucro"?"L":"P"}</div><div><p style={{fontWeight:700,fontSize:16,color:C.navy,textTransform:"capitalize",marginBottom:4}}>Situacao: {an.situacao}</p>{an.distribuicaoPossivel?<p style={{fontSize:13,color:C.success,fontWeight:600}}>Distribuicao possivel - valor sugerido: {fmt(an.valorSugerido)}</p>:<p style={{fontSize:13,color:C.danger,fontWeight:600}}>Distribuicao nao recomendada</p>}</div></div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:14}}>{[{label:"Pontos Fortes",items:an.pontosForca,bg:"#F0FDF4",cor:C.success,bdr:"#86EFAC"},{label:"Pontos de Atencao",items:an.pontosAtencao,bg:"#FFFBEB",cor:C.gold,bdr:"#FDE68A"},{label:"Recomendacoes",items:an.recomendacoes,bg:"#F0FDFA",cor:C.teal,bdr:"#99F6E4"}].map(sec=>(<div key={sec.label} style={{background:sec.bg,borderRadius:10,padding:16,border:"1px solid "+sec.bdr}}><p style={{fontWeight:700,fontSize:13,color:sec.cor,marginBottom:10}}>{sec.label}</p><ul style={{paddingLeft:16,display:"flex",flexDirection:"column",gap:8}}>{(sec.items||[]).map((item,i)=>(<li key={i} style={{fontSize:12,color:"#374151",lineHeight:1.5}}>{item}</li>))}</ul></div>))}</div></div>)}
      </div>
    </Card>
    </>)}
  </div>);}

function App(){
  const [dados,setDados]=useState(()=>carregar());
  const [step,setStep]=useState(0);
  const [periodo,setPeriodo]=useState("Q1-2025");
  const [clienteSel,setClienteSel]=useState(null);
  useEffect(()=>{const d=carregar();if(d.periodos&&Object.keys(d.periodos).some(k=>Object.keys(d.periodos[k]).some(x=>d.periodos[k][x]?.resumo))){setStep(3);}});
  return(<div style={{minHeight:"100vh",background:C.bg}}>
    <Header step={step} setStep={setStep}/>
    <div style={{maxWidth:1200,margin:"0 auto",padding:"22px 18px 80px"}}>
      {step===0&&<Step1 dados={dados} setDados={setDados} onNext={()=>setStep(1)}/>}
      {step===1&&<Step2 dados={dados} setDados={setDados} periodo={periodo} setPeriodo={setPeriodo} onNext={()=>setStep(2)} onBack={()=>setStep(0)}/>}
      {step===2&&<Step3 dados={dados} setDados={setDados} periodo={periodo} onNext={()=>setStep(3)} onBack={()=>setStep(1)}/>}
      {step===3&&<Step4 dados={dados} periodo={periodo} setPeriodo={setPeriodo} setStep={setStep} setClienteSel={setClienteSel}/>}
      {step===4&&<Step5 dados={dados} periodo={periodo} clienteSel={clienteSel} setClienteSel={setClienteSel} setStep={setStep}/>}
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
